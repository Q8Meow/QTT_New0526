validation_invariants:
  - Parameter selection universe consumer access is static deterministic metadata only.
  - Required universe IDs are defined by the PR79 selection universe registry.
  - Agent roles are validated against the QTT agent role operating charter registry surface and report.
  - Consumer classes are explicit static labels only.
  - Unknown agent role unknown universe unknown consumer class missing binding disallowed pair and disallowed class block normal access.
  - Owner override satisfies internal universe consumption access only and fabricates no external facts or evidence.
  - Source retrieval source acceptance connector semantics runtime live order profit replay paper routing selection scoring ranking arbitration candidate generation and quantum backend authority are not created.
  - Strongest classical comparator fallback bundle replay paper evidence and live evidence requirements remain future policy metadata.
  - AtomicRows bundle rows bundle JSONL bundle SHA and bundle hash authority are not created.
final_ready: false
