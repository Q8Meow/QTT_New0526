validation_invariants:
  - Trade context selection universe routing is static route eligibility only.
  - Required trade context fields are consumed deterministically and unknown fields fail closed.
  - Selection universe metadata comes from the PR79 static registry.
  - Consumer access metadata comes from the PR80 static consumer gate.
  - Route candidates are sorted by canonical universe_id ascending.
  - Owner override satisfies internal route eligibility only and fabricates no external facts or evidence.
  - Quantum metadata is preserved only as future-compatible static metadata.
  - No stack selection scoring ranking optimizer arbitration candidate generation replay paper runtime live order source connector profit or quantum backend authority is created.
  - AtomicRows bundle rows bundle JSONL bundle SHA and bundle hash authority are not created.
final_ready: false
