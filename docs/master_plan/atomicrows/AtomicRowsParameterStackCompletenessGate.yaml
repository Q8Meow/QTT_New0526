validation_invariants:
  - Required stack roles must equal the PR73 canonical nine-role order.
  - Missing required role blocks normal stack readiness unless owner override satisfies internal readiness only.
  - Missing QUANTUM_ADVISORY blocks normal completeness unless owner override satisfies internal readiness only.
  - Duplicate role IDs block normal stack readiness.
  - Single-parameter and single-algorithm sets are incomplete without owner override.
  - Owner override cannot fabricate source facts evidence receipts replay paper profit or quantum backend evidence.
  - This gate does not create compatibility selection scoring ranking arbitration routing runtime live order profit replay paper or quantum backend evidence.
  - AtomicRows bundle rows bundle jsonl and bundle sha256 remain forbidden artifacts.
final_ready: false
