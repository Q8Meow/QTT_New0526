field_fill_rules:
  - rule_id: INTERNAL_CURRENT_REPO_VALUE_RULE
    when: VALUE_EXISTS_IN_CURRENT_MASTER_PLAN_ROADMAP_SCHEMA_VALIDATOR_REPORT_CONFIG_REGISTRY_OR_COMMAND_MATRIX
    value_policy: FILL_AS_INTERNAL_AND_RECORD_EXACT_SOURCE_POINTER
    authority_classes:
      - INTERNAL_MASTER_PLAN_VALUE
      - INTERNAL_REPO_ARTIFACT_VALUE
      - INTERNAL_ROADMAP_VALUE
    block_code: null
  - rule_id: OWNER_POLICY_VALUE_RULE
    when: VALUE_IS_OWNER_POLICY
    value_policy: FILL_FROM_OWNER_APPROVED_POLICY_ARTIFACT_OR_OWNER_RECEIPT_AND_RECORD_SOURCE_POINTER
    authority_classes:
      - OWNER_POLICY_VALUE
    block_code: null
  - rule_id: EXTERNAL_FACT_RULE
    when: VALUE_IS_EXTERNAL_VENUE_SOURCE_API_FEE_TICK_SETTLEMENT_SDK_OR_RATE_LIMIT_FACT
    value_policy: LEAVE_VALUE_NULL
    authority_classes:
      - ACCEPTED_SOURCE_EVIDENCE_REQUIRED
    block_code: SOURCE_EVIDENCE_REQUIRED
  - rule_id: RUNTIME_PRIVATE_STATE_RULE
    when: VALUE_DEPENDS_ON_RUNTIME_CASH_ACCOUNT_ORDER_FILL_OR_PRIVATE_STATE
    value_policy: LEAVE_VALUE_NULL
    authority_classes:
      - RUNTIME_RECEIPT_REQUIRED
    block_code: RUNTIME_RECEIPT_REQUIRED
  - rule_id: REPLAY_RESULT_RULE
    when: VALUE_DEPENDS_ON_REPLAY_RESULT
    value_policy: LEAVE_VALUE_NULL
    authority_classes:
      - REPLAY_RESULT_REQUIRED
    block_code: REPLAY_RESULT_REQUIRED
  - rule_id: PAPER_RESULT_RULE
    when: VALUE_DEPENDS_ON_PAPER_RESULT
    value_policy: LEAVE_VALUE_NULL
    authority_classes:
      - PAPER_RESULT_REQUIRED
    block_code: PAPER_RESULT_REQUIRED
  - rule_id: OPTIMIZER_RESULT_RULE
    when: VALUE_DEPENDS_ON_OPTIMIZER_EXECUTION
    value_policy: LEAVE_VALUE_NULL
    authority_classes:
      - OPTIMIZER_RESULT_REQUIRED
    block_code: OPTIMIZER_RESULT_REQUIRED
  - rule_id: QUANTUM_BACKEND_RESULT_RULE
    when: VALUE_DEPENDS_ON_QUANTUM_BACKEND_SIMULATOR_PROVIDER_QUBO_ISING_QAOA_VQE_ANNEALING_OR_QUANTUM_PORTFOLIO_OPTIMIZATION_EXECUTION
    value_policy: LEAVE_VALUE_NULL
    authority_classes:
      - QUANTUM_BACKEND_RECEIPT_REQUIRED
    block_code: QUANTUM_BACKEND_RECEIPT_REQUIRED
  - rule_id: UNCLEAR_AUTHORITY_RULE
    when: AUTHORITY_IS_UNCLEAR
    value_policy: LEAVE_VALUE_NULL_AND_MARK_OWNER_APPROVAL_REQUIRED_OR_BLOCKED_PENDING_FUTURE_SCOPE
    authority_classes:
      - OWNER_APPROVAL_REQUIRED
      - BLOCKED_PENDING_FUTURE_SCOPE
    block_code: OWNER_APPROVAL_REQUIRED_OR_BLOCKED_PENDING_FUTURE_SCOPE
  - rule_id: NO_FABRICATION_RULE
    when: ANY_FIELD_FILL_ATTEMPT
    value_policy: NO_BLANKS_NO_GUESSING_NO_PROBABLY_NO_FABRICATED_ROW_IDS_NO_FAKE_EXTERNAL_VALUES_NO_RUNTIME_RECEIPT_INVENTION_NO_REPLAY_PAPER_RESULT_INVENTION_NO_OPTIMIZER_RESULT_INVENTION_NO_QUANTUM_BACKEND_OUTPUT_INVENTION_NO_PROFIT_LATENCY_EXECUTION_SUPERIORITY_OR_QUANTUM_ADVANTAGE_INVENTION
    authority_classes:
      - BLOCKED_PENDING_FUTURE_SCOPE
    block_code: BLOCKED_PENDING_FUTURE_SCOPE
