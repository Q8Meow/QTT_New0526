validation_invariants:
  - Required stack roles must equal the PR73 and PR74 canonical nine-role order.
  - PR74 completeness must pass before normal compatibility may pass.
  - All nine role interface contracts must be present.
  - Missing mismatched duplicate and authority-incompatible interfaces block normal compatibility.
  - Source evidence connector semantic runtime live order and quantum boundary violations block normal compatibility.
  - OWNER_GLOBAL_OVERRIDE satisfies internal compatibility only and does not fabricate external facts or evidence.
  - This gate does not perform completeness scoring ranking selection arbitration routing replay paper runtime live or order behavior.
  - AtomicRows bundle rows bundle jsonl and bundle sha256 remain forbidden artifacts.
