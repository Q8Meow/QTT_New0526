        uses: actions/checkout@v4
        with: &checkout_full
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: &pip_cache
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.14.6-pip-pytest-9.1.1-${{ hashFiles('.github/workflows/qtt_validation.yml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.14.6-pip-pytest-9.1.1-

      - name: Install test dependency
        run: &install_pytest |
          python -m pip install --only-binary=:all: --no-deps --index-url https://pypi.org/simple \
            pytest==9.1.1 \
            iniconfig==2.3.0 \
            packaging==26.0 \
            pluggy==1.6.0 \
            pygments==2.21.0 \
            websockets==17.0.1 \
            cryptography==50.0.1 \
            cffi==2.1.1 \
            pycparser==3.0 \
            jsonschema==4.26.0 \
            jsonschema-specifications==2025.9.1 \
            referencing==0.37.0 \
            rpds-py==2026.5.1 \
            attrs==26.1.0
