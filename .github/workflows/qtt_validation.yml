                  add("registration","monotonic",src["admission"],src["deadline"])
                  keys=src["original_keys"]
                  if len(keys)!=2: raise ValueError("keys")
                  for key,valid,expiry,*_ in keys:
                      ident=exact(key,("LP03-KEY::owner","LP03-KEY::issuer"))
                      add(ident,"wall",valid,expiry)
                  if len({k[0] for k in keys})!=2: raise ValueError("duplicate key")
                  rights=src["original_rights"]
                  ids=[string(r[0],r"LP03-ORIGINAL-RIGHTS::[0-8]",32) for r in rights]
                  if len(ids)!=9 or len(set(ids))!=9: raise ValueError("rights")
