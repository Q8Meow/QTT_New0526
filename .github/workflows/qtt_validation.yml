            'https://github.com/actions/python-versions/releases/download/3.14.6-27283001424/python-3.14.6-linux-26.04-x64.tar.gz' \
            --output "$input/release.tar.gz"
          printf '%s  %s\n' '55cfde07795c60a573e466b645ce654d8a3de37b6a7cada8ce9dd67933717e1a' "$input/release.tar.gz" | sha256sum --check --status
          printf '%s\n' 'pip==26.3 --hash=sha256:f3b60b20ffaadd4415ed7957212a38ac63fa4c5fa375bd0f4a797777940fad13' > "$input/pip.txt"
          /usr/bin/python3 -m pip --isolated download --disable-pip-version-check \
            --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple \
            --dest "$input/wheels" -r "$input/pip.txt"
          tar -xzf "$input/release.tar.gz" -C "$input/release"
          (
