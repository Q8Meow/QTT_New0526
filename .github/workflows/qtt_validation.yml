          mkdir -m 0750 "$sealed"
          mkdir -m 0755 "$sealed/python"
          cp -a --reflink=never --no-preserve=ownership,mode,xattr "$runtime/." "$sealed/python/"
          diff -qr --no-dereference "$runtime" "$sealed/python" >/dev/null
          SEAL_RUNTIME
