              if "BEFORE_NATIVE_COMMIT" in m:
                  src=m["BEFORE_NATIVE_COMMIT"]
                  observed["native_sql_entry"]={"source_line":659,"sample":sample(src["original"]),
                      **{k:flag(src[k]) for k in ("same_connection","transaction_open","original_active","original_adapter_frame")}}
              if "declaration" in observed and "checkpoint" in observed:
                  cp=observed["checkpoint"]["sample"]
                  d=observed["declaration"]
                  observed["declaration_to_checkpoint_monotonic_ns"]=[cp["monotonic_ns"]-d[k]["monotonic_ns"] for k in ("after","before")]
                  observed["declaration_to_checkpoint_wall_ns"]=[cp["wall_ns"]-d[k]["wall_ns"] for k in ("after","before")]
              if "PHASE_COUNTS" in m:
                  observed["counts"]={k:integer(m["PHASE_COUNTS"][k],0,100) for k in
                      ("admission","checkpoint_738","custody","guard_sample","commit_entry","returned_rows")}
              if "RESULT" in m:
                  src=m["RESULT"]
                  exact(src["math"],("MATH-03",)); exact(src["origin"],("SOFTWARE_CONFORMANCE",))
                  observed["registration_admission"]=sample(src["admission"])
                  cp=observed["checkpoint"]["sample"]; guard=observed["currentness"]["sample"]
                  assert cp==sample(src["attempted_checkpoint_738"]) and guard==sample(src["enforced_sample"])
                  effective,=[d for d in src["deadlines"] if d["name"]=="effective_experiment_expiry"]
                  end=integer(effective["exclusive_end_ns"])
                  observed["limits"]["effective_experiment_expiry"]={"valid_from_ns":None,"exclusive_end_ns":end,"clock":"wall",
                      "remaining_at_738_ns":end-cp["wall_ns"],"remaining_at_native_guard_ns":end-guard["wall_ns"]}
                  observed["caps"]={k:integer(src["budgets"][k]) for k in
                      ("cpu_cap_ns","wall_cap_ns","cpu_remaining_at_checkpoint_738_ns","wall_remaining_at_checkpoint_738_ns")}
                  observed["per_attempt_cpu_cap_ns"]=integer(src["cap_profile"]["per_attempt_cpu_ns"])
                  rows=src["rows"]
                  if len(rows)!=10: raise ValueError("rows")
                  tables=[exact(r["table"],("receipt_records","idempotency_claims")) for r in rows]
                  observed["committed"]={"sample":sample(src["registration_commit"]),"readback":sample(src["native_readback"]),
                      "phase":exact(src["actual_registered_state"],("COMMITTED_AND_READBACK",)),
                      "registered_handle":string(src["registration_handle"],r"LP03-ASSEMBLY::[0-9a-f]{32}::INPUT_ASSEMBLY::EXPERIMENT:1",110),
                      "handle_store":exact(src["handle_store"],("LP03-STORE::CONTROL",)),
                      "receipt_rows":tables.count("receipt_records"),"reservation_rows":tables.count("idempotency_claims"),
                      "all_native_rows_equal":all(flag(r["direct_native_bytes_equal"]) for r in rows),
                      "protocol_bytes_match":flag(src["canonical_protocol_bytes_match"]),"signed_message_matches":flag(src["signed_message_exact"]),
                      "original_signature_matches":flag(src["original_signature_exact"]),"attempts":integer(src["attempt_count"],0,1),
                      "no_compilation":flag(src["no_compilation"])}
          def environment(report):
              job=file_json(private/"job.json")
              target=report["environment"]
              target.update(image_os=string(job["imageOS"],r"(?i)win(?:dows)?[-_]?(?:2025|25)",24),
                  image_version=string(job["imageVersion"],r"[0-9]+(?:\.[0-9]+){1,5}",48),
                  runner_os=exact(job["runnerOS"],("Windows",)),runner_arch=exact(job["runnerArch"],("X64",)),
                  workflow_revision=string(job["workflowRevision"],r"[a-f0-9]{40}",40))
              if not (private/"environment.json").is_file():return
