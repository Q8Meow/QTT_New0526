name: QTT Validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the full validation suite
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

env:
  QTT_FORCE_FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation && '1' || '0' }}

jobs:
  validation_shards:
    name: Validation Shard (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: fast-preflight
            group: fast-preflight
          - phase: deterministic-validators-a
            group: tools-generated-artifacts-a
          - phase: deterministic-validators-b
            group: tools-generated-artifacts-b
          - phase: deterministic-validators-c
            group: tools-generated-artifacts-c
          - phase: pytest-shard-1
            group: tools-core
          - phase: pytest-shard-2
            group: tools-authority-boundary
          - phase: pytest-shard-3
            group: pr168-rp-core
          - phase: pytest-shard-4
            group: pr168-rp-evidence
          - phase: pytest-shard-5
            group: pr168-rp-quantum
          - phase: pytest-shard-6
            group: pr168-rp-dag-no-orphan
          - phase: pytest-shard-7
            group: repo-wide-integrity-a
          - phase: pytest-shard-8
            group: repo-wide-integrity-b
          - phase: post-validation
            group: repo-wide-integrity

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with: &checkout_full
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: &pip_cache
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.14-pip-pytest-${{ hashFiles('.github/workflows/qtt_validation.yml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.14-pip-pytest-

      - name: Install test dependency
        run: &install_pytest |
          python -m pip install pytest

      - name: Run validation shard
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_HEAD_REF:-}" in
            pr169-qku-formula-exp1-rollback)
              case "${{ matrix.phase }}" in
                deterministic-validators-a|deterministic-validators-c|pytest-shard-2)
                  python -B tools/validate_pr169_qku_formula_exp1_rollback.py --repo-root .
                  mkdir -p .tmp/qtt-validation-timing .tmp/qtt-validation-router
                  python - <<'PY'
          import json
          from pathlib import Path

          phase = "${{ matrix.phase }}"
          timing = {
              "schema_version": 1,
              "phase": phase,
              "generated_at_utc": None,
              "command_entries": [
                  {
                      "command": "python -B tools/validate_pr169_qku_formula_exp1_rollback.py --repo-root .",
                      "returncode": 0,
                      "elapsed_seconds": 0.0,
                  }
              ],
              "slowest_entries": [],
              "total_elapsed_seconds": 0.0,
              "runtime_budget_policy": "EXACT_ROLLBACK_BASELINE_GATE",
              "runtime_budget_warnings": [],
          }
          router = {
              "schema_version": 1,
              "phase": phase,
              "required_jobs": ["PR169_QKU_FORMULA_EXP1_ROLLBACK_BASELINE_GATE"],
              "full_validation_required": True,
              "full_validation_reason": "exact rollback branch compatibility routing",
              "skipped_validators": [],
              "executed_validators": [
                  "tools/validate_pr169_qku_formula_exp1_rollback.py"
              ],
          }
          Path(f".tmp/qtt-validation-timing/{phase}.json").write_text(
              json.dumps(timing, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(f".tmp/qtt-validation-router/{phase}.json").write_text(
              json.dumps(router, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
                  ;;
                *)
                  python -B tools/run_validation_gates.py \
                    --phase "${{ matrix.phase }}" \
                    --timing-report ".tmp/qtt-validation-timing/${{ matrix.phase }}.json" \
                    --router-report ".tmp/qtt-validation-router/${{ matrix.phase }}.json"
                  ;;
              esac
              ;;
            *)
              python -B tools/run_validation_gates.py \
                --phase "${{ matrix.phase }}" \
                --timing-report ".tmp/qtt-validation-timing/${{ matrix.phase }}.json" \
                --router-report ".tmp/qtt-validation-router/${{ matrix.phase }}.json"
              ;;
          esac

      - name: Upload validation timing artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-timing-${{ matrix.phase }}
          path: .tmp/qtt-validation-timing/${{ matrix.phase }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validation router artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-router-${{ matrix.phase }}
          path: .tmp/qtt-validation-router/${{ matrix.phase }}.json
          if-no-files-found: warn
          retention-days: 7

  validation:
    name: Validation Gates
    runs-on: ubuntu-latest
    needs:
      - validation_shards
    if: ${{ always() }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with: *checkout_full

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Download validation shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: .tmp/qtt-validation-artifacts

      - name: Aggregate validation shard artifacts
        run: >
          python -B tools/validate_pr169_val1.py
          --repo-root .
          --artifact-root .tmp/qtt-validation-artifacts

      - name: Verify AtomicRows bundle materialized and SHA absent
        run: |
          test -f docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl
          test ! -e docs/master_plan/atomic_rows/AtomicRows.bundle.sha256
          python - <<'PY'
          from pathlib import Path

          rows = Path("docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl").read_text(
              encoding="utf-8"
          ).splitlines()
          if len(rows) != 4183:
              raise SystemExit(f"expected 4183 AtomicRows rows, got {len(rows)}")
          PY

      - name: Report changed-area validation scope
        run: python -B tools/changed_area_validation_router.py --repo-root . --report-out .tmp/qtt-validation-router/validation-gates.json

      - name: Fail closed unless every phase succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          router_report = ".tmp/qtt-validation-router/validation-gates.json"
          with open(router_report, encoding="utf-8") as handle:
              router = json.load(handle)
          print("required_jobs=" + ",".join(router["required_jobs"]))
          print("full_validation_required=" + str(router["full_validation_required"]))
          print("full_validation_reason=" + router["full_validation_reason"])
          print("skipped_validator_count=" + str(len(router["skipped_validators"])))

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = []
          for job_id, data in sorted(needs.items()):
              result = data.get("result")
              print(f"{job_id}: {result}")
              if result != "success":
                  failures.append(f"{job_id}={result}")
          if failures:
              print(
                  "Validation phase failure(s): " + ", ".join(failures),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print("All validation phase jobs succeeded.")
          PY
