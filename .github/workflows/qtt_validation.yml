name: QTT Validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the full validation suite
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

env:
  QTT_FORCE_FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation && '1' || '0' }}

jobs:
  fast_preflight:
    name: Fast Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with: &checkout_full
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: &pip_cache
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.14-pip-pytest-${{ hashFiles('.github/workflows/qtt_validation.yml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.14-pip-pytest-

      - name: Install test dependency
        run: &install_pytest |
          python -m pip install pytest

      - name: Run fast preflight
        run: python -B tools/run_validation_gates.py --phase fast-preflight --timing-report .tmp/qtt-validation-timing/fast-preflight.json --router-report .tmp/qtt-validation-router/fast-preflight.json

  deterministic_validators:
    name: Deterministic Validators
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with: *checkout_full

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run deterministic validators
        run: python -B tools/run_validation_gates.py --phase deterministic-validators --timing-report .tmp/qtt-validation-timing/deterministic-validators.json --router-report .tmp/qtt-validation-router/deterministic-validators.json

  pytest_shard_1:
    name: Pytest Shard 1
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Checkout light pytest surface
        uses: actions/checkout@v4
        with: &checkout_light_pytest
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          # LIGHT_PYTEST_CHECKOUT keeps ordinary pytest shards off PR166-SM2 report fixtures.
          sparse-checkout: |
            .github
            AGENTS.md
            data
            docs/master_plan/**
            !docs/master_plan/generated/PR166_SM2_*.report.json
            !docs/master_plan/generated/pr166_sm2_shards/**
            pyproject.toml
            pytest.ini
            requirements.txt
            requirements-dev.txt
            schemas
            src
            tests
            tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 1
        run: python -B tools/run_validation_gates.py --phase pytest-shard-1 --timing-report .tmp/qtt-validation-timing/pytest-shard-1.json --router-report .tmp/qtt-validation-router/pytest-shard-1.json

  pytest_shard_2:
    name: Pytest Shard 2
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Checkout light pytest surface
        uses: actions/checkout@v4
        with: *checkout_light_pytest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 2
        run: python -B tools/run_validation_gates.py --phase pytest-shard-2 --timing-report .tmp/qtt-validation-timing/pytest-shard-2.json --router-report .tmp/qtt-validation-router/pytest-shard-2.json

  pytest_shard_3:
    name: Pytest Shard 3
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Checkout light pytest surface
        uses: actions/checkout@v4
        with: *checkout_light_pytest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 3
        run: python -B tools/run_validation_gates.py --phase pytest-shard-3 --timing-report .tmp/qtt-validation-timing/pytest-shard-3.json --router-report .tmp/qtt-validation-router/pytest-shard-3.json

  pytest_shard_4:
    name: Pytest Shard 4
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Checkout PR166-SM2 report fixture pytest surface
        uses: actions/checkout@v4
        with: &checkout_pr166_sm2_report_fixture_pytest
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          # PR166_SM2_REPORT_FIXTURE_CHECKOUT is required by Shards 4/5/7.
          sparse-checkout: |
            .github
            AGENTS.md
            data
            docs/master_plan/**
            docs/master_plan/generated/PR166_SM2_*.report.json
            docs/master_plan/generated/pr166_sm2_shards/**
            pyproject.toml
            pytest.ini
            requirements.txt
            requirements-dev.txt
            schemas
            src
            tests
            tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 4
        run: python -B tools/run_validation_gates.py --phase pytest-shard-4 --timing-report .tmp/qtt-validation-timing/pytest-shard-4.json --router-report .tmp/qtt-validation-router/pytest-shard-4.json

  pytest_shard_5:
    name: Pytest Shard 5
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Checkout PR166-SM2 report fixture pytest surface
        uses: actions/checkout@v4
        with: *checkout_pr166_sm2_report_fixture_pytest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 5
        run: python -B tools/run_validation_gates.py --phase pytest-shard-5 --timing-report .tmp/qtt-validation-timing/pytest-shard-5.json --router-report .tmp/qtt-validation-router/pytest-shard-5.json

  pytest_shard_6:
    name: Pytest Shard 6
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Checkout light pytest surface
        uses: actions/checkout@v4
        with: *checkout_light_pytest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 6
        run: python -B tools/run_validation_gates.py --phase pytest-shard-6 --timing-report .tmp/qtt-validation-timing/pytest-shard-6.json --router-report .tmp/qtt-validation-router/pytest-shard-6.json

  pytest_shard_7:
    name: Pytest Shard 7
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Checkout PR166-SM2 report fixture pytest surface
        uses: actions/checkout@v4
        with: *checkout_pr166_sm2_report_fixture_pytest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 7
        run: python -B tools/run_validation_gates.py --phase pytest-shard-7 --timing-report .tmp/qtt-validation-timing/pytest-shard-7.json --router-report .tmp/qtt-validation-router/pytest-shard-7.json

  pytest_shard_8:
    name: Pytest Shard 8
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Checkout light pytest surface
        uses: actions/checkout@v4
        with: *checkout_light_pytest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 8
        run: python -B tools/run_validation_gates.py --phase pytest-shard-8 --timing-report .tmp/qtt-validation-timing/pytest-shard-8.json --router-report .tmp/qtt-validation-router/pytest-shard-8.json

  post_validation_checks:
    name: Post Validation Checks
    runs-on: ubuntu-latest
    needs:
      - deterministic_validators
      - pytest_shard_1
      - pytest_shard_2
      - pytest_shard_3
      - pytest_shard_4
      - pytest_shard_5
      - pytest_shard_6
      - pytest_shard_7
      - pytest_shard_8
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with: *checkout_full

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Verify AtomicRows bundle materialized and SHA absent
        # Enforced by the post-validation runner phase:
        # test -f docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl
        # test ! -e docs/master_plan/atomic_rows/AtomicRows.bundle.sha256
        # expected 4183 AtomicRows rows
        run: python -B tools/run_validation_gates.py --phase post-validation --timing-report .tmp/qtt-validation-timing/post-validation.json --router-report .tmp/qtt-validation-router/post-validation.json

  validation:
    name: Validation Gates
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
      - deterministic_validators
      - pytest_shard_1
      - pytest_shard_2
      - pytest_shard_3
      - pytest_shard_4
      - pytest_shard_5
      - pytest_shard_6
      - pytest_shard_7
      - pytest_shard_8
      - post_validation_checks
    if: ${{ always() }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with: *checkout_full

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Report changed-area validation scope
        run: python -B tools/changed_area_validation_router.py --repo-root . --report-out .tmp/qtt-validation-router/validation-gates.json

      - name: Fail closed unless every phase succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          router_report = ".tmp/qtt-validation-router/validation-gates.json"
          with open(router_report, encoding="utf-8") as handle:
              router = json.load(handle)
          print("required_jobs=" + ",".join(router["required_jobs"]))
          print("full_validation_required=" + str(router["full_validation_required"]))
          print("full_validation_reason=" + router["full_validation_reason"])
          print("skipped_validator_count=" + str(len(router["skipped_validators"])))

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = []
          for job_id, data in sorted(needs.items()):
              result = data.get("result")
              print(f"{job_id}: {result}")
              if result != "success":
                  failures.append(f"{job_id}={result}")
          if failures:
              print(
                  "Validation phase failure(s): " + ", ".join(failures),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print("All validation phase jobs succeeded.")
          PY
