                      if not all((flag(r[4]),flag(r[5]),flag(r[8]))) or integer(r[6])!=integer(r[7]): raise ValueError("rights custody")
                      add(ident+"/validity","wall",r[1],r[2])
                      add(ident+"/retention","wall",None,r[3])
