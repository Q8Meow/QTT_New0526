name: QTT Validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Validation Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependency
        run: |
          python -m pip install pytest

      - name: Run canonical validation gates
        run: python tools/run_validation_gates.py

      - name: Compile Python sources
        run: python -m compileall -q tools tests src

      - name: Check diff whitespace
        run: git diff --check

      - name: Verify master plan unchanged by validation
        run: git diff --exit-code -- docs/master_plan/QTT_MasterPlan_Current.md

      - name: Verify AtomicRows bundle materialized and SHA absent
        run: |
          test -f docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl
          test ! -e docs/master_plan/atomic_rows/AtomicRows.bundle.sha256
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl")
          data = p.read_bytes()
          assert data, "AtomicRows bundle is empty"
          assert not data.startswith(b"\xef\xbb\xbf"), "AtomicRows bundle has a UTF-8 BOM"
          assert b"\r" not in data, "AtomicRows bundle contains CR or CRLF line endings"
          assert data.endswith(b"\n"), "AtomicRows bundle must end with LF"
          lines = data.decode("utf-8").splitlines()
          assert len(lines) == 4183, f"expected 4183 AtomicRows rows, found {len(lines)}"
          assert all(line.strip() for line in lines), "AtomicRows bundle contains blank rows"
          for line_number, line in enumerate(lines, start=1):
              json.loads(line)
          PY
