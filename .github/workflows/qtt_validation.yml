    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the full validation suite
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

env:
  QTT_FORCE_FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation && '1' || '0' }}

