                      held = f"/proc/self/fd/{fd}"
                      if stat.S_ISLNK(item.st_mode):
                          rel = out.relative_to(destination).as_posix()
                          link = os.readlink("", dir_fd=fd)
                          if links.get(rel) != link:
                              raise OSError(f"Unapproved seal link: {rel} -> {link!r}")
                          out.symlink_to(link)
                          verify(out, stat.S_IFLNK, 0o777)
                          seen_links.add(rel)
                      elif stat.S_ISDIR(item.st_mode):
                          child = os.open(held, os.O_RDONLY | os.O_DIRECTORY)
                          try:
                              copy_directory(child, out)
                          finally:
                              os.close(child)
                      elif stat.S_ISREG(item.st_mode) and item.st_nlink == 1 and not item.st_mode & 0o7000:
                          counts["bytes"] += item.st_size
                          if counts["bytes"] > budget:
                              raise OSError(f"Seal size limit exceeded: {name}")
                          with open(held, "rb") as original, out.open("xb") as installed:
                              remaining = item.st_size
                              while remaining:
                                  block = original.read(min(remaining, 1048576))
                                  if not block:
                                      raise OSError(f"Short seal source: {out}")
                                  installed.write(block)
                                  remaining -= len(block)
                              if original.read(1) or os.fstat(fd).st_ctime_ns != item.st_ctime_ns:
                                  raise OSError(f"Seal source changed: {out}")
                          mode = 0o555 if item.st_mode & 0o111 else 0o444
                          out.chmod(mode)
                          verify(out, stat.S_IFREG, mode)
                          if name == "python" and out.relative_to(destination).as_posix() in {
                                  "bin/python3.14", "lib/libpython3.14.so.1.0"}:
                              print(f"LP03_SEAL_MODE {out.relative_to(destination)} "
                                    f"source={stat.S_IMODE(item.st_mode):04o} sealed={mode:04o}", flush=True)
                          counts["executable" if mode == 0o555 else "data"] += 1
                      else:
                          raise OSError(f"Unsupported seal source type, links or mode: {out}")
                  finally:
                      os.close(fd)
              target.chmod(0o555)
              verify(target, stat.S_IFDIR, 0o555)
              counts["directories"] += 1

          if os.getresuid() != (0, 0, 0) or source.resolve(strict=True) != source:
              raise SystemExit("Sealing requires the fixed source and original bootstrap owner")
          top = os.open(source, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              copy_directory(top, destination)
          finally:
              os.close(top)
          if seen_links != links.keys():
              raise OSError(f"Sealed {name} symlink set differs from reviewed inputs")
          for rel in sorted(links):
              real = (destination / rel).resolve(strict=True)
              if not real.is_relative_to(destination) or not real.is_file():
                  raise OSError(f"Sealed alias has no internal regular target: {rel}")
          print("LP03_SEALED", name, counts, "links", len(links), flush=True)
          SEAL_TREE
          chmod 0400 /run/qtt-lp03-containment/seal.py
          /usr/bin/python3 -I -S -B /run/qtt-lp03-containment/seal.py python
          diff -qr --no-dereference "$runtime" "$sealed/python" >/dev/null
          printf 'LP03_SEAL_BYTES_VERIFIED python\n'
          SEAL_RUNTIME
      - name: Select the verified Python toolcache entry
        id: sealed_python
        timeout-minutes: 1
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
          check-latest: false
      - name: Install the locked qualification dependencies
        timeout-minutes: 1
        env:
          SETUP_PYTHON_PATH: ${{ steps.sealed_python.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(readlink -f "$SETUP_PYTHON_PATH")" = /opt/hostedtoolcache/Python/3.14.6/x64/bin/python3.14
          test "$(command -v python)" = /opt/hostedtoolcache/Python/3.14.6/x64/bin/python
          test "$(python -V)" = 'Python 3.14.6'
          lock="$(mktemp "$RUNNER_TEMP/qtt-lp03-deps.XXXXXXXX")"
          cat > "$lock" <<'WHEELS'
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          iniconfig==2.3.1 --hash=sha256:9121e2c1fdb355232495be3194c8dfe87ccc2d5dee45947b78e68f499790d7a7
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pluggy==1.7.0 --hash=sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec
          pygments==2.21.0 --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9
          WHEELS
          site="$RUNNER_TEMP/qtt-pr309-site"
          mkdir "$site"
          python -B -m pip --isolated install --disable-pip-version-check --require-hashes \
            --no-deps --only-binary=:all: --no-compile --ignore-installed --target "$site" \
            --index-url https://pypi.org/simple -r "$lock"
      - name: Run the existing native supervision fixtures
        id: native_qualification
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          git show HEAD:.github/workflows/qtt_validation.yml | cmp - .github/workflows/qtt_validation.yml
          tracked=/home/runner/work/_temp/qtt-pr309-tracked
          /usr/bin/python3 -I -B - "$tracked" <<'VERIFY_TRACKED'
          from pathlib import Path
          import os
          import stat
          import subprocess
          import sys

          root = Path(sys.argv[1])
          projection = ('.github/workflows/qtt_validation.yml', 'tools', 'src',
                        'tests/fail_closed/test_run_validation_gates.py', 'pytest.ini')
          records = subprocess.check_output(
              ['git', 'ls-tree', '-r', '-z', 'HEAD', '--', *projection]
          ).split(b'\0')[:-1]
          expected = {}
          for record in records:
              metadata, path = record.split(b'\t', 1)
              mode, kind, identity = metadata.split()
              relative = Path(os.fsdecode(path))
              if (kind != b'blob' or mode not in {b'100644', b'100755'}
                      or relative.is_absolute() or '..' in relative.parts or relative in expected):
                  raise SystemExit('Unsupported tracked qualification input')
              expected[relative] = (identity, mode)
          actual = set()
          for directory, children, files in os.walk(root, followlinks=False):
              for name in children + files:
                  path = Path(directory) / name
                  observed = path.lstat()
                  if not (stat.S_ISDIR(observed.st_mode) or stat.S_ISREG(observed.st_mode)):
                      raise SystemExit('Linked or special qualification input')
                  if stat.S_ISREG(observed.st_mode):
                      actual.add(path.relative_to(root))
          if actual != set(expected):
              raise SystemExit('Extracted qualification paths differ from the Git roster')
          batch = subprocess.Popen(['git', 'cat-file', '--batch'], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          try:
              for relative, (object_id, mode) in expected.items():
                  batch.stdin.write(object_id + b'\n')
                  batch.stdin.flush()
                  observed, kind, size = batch.stdout.readline().split()
                  if kind != b'blob' or observed != object_id:
                      raise SystemExit('Git blob association failed')
                  with (root / relative).open('rb') as installed:
                      actual_mode = os.fstat(installed.fileno()).st_mode
                      if bool(actual_mode & 0o111) != (mode == b'100755'):
                          raise SystemExit(f'Extracted executable mode differs from Git: {relative}')
                      remaining = int(size)
                      while remaining:
                          chunk = batch.stdout.read(min(remaining, 1_048_576))
                          if not chunk or installed.read(len(chunk)) != chunk:
                              raise SystemExit('Extracted qualification bytes differ from Git')
                          remaining -= len(chunk)
                      if installed.read(1) or batch.stdout.read(1) != b'\n':
                          raise SystemExit('Extracted qualification length differs from Git')
          finally:
              batch.stdin.close()
              batch.stdout.close()
              if batch.wait(timeout=5):
                  raise SystemExit('Git batch verification failed')
          VERIFY_TRACKED
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/bash -se <<'SEAL_INPUTS'
          set -euo pipefail
          umask 022
          sealed=/run/qtt-lp03-containment/sealed
          workspace=/home/runner/work/_temp/qtt-pr309-tracked
          site=/home/runner/work/_temp/qtt-pr309-site
          runtime=/opt/hostedtoolcache/Python/3.14.6/x64
          diff -qr --no-dereference "$runtime" "$sealed/python" >/dev/null
          workspace_size=$(du -sb -- "$workspace" | cut -f1)
          site_size=$(du -sb -- "$site" | cut -f1)
          test "$workspace_size" -le 104857600
          test "$site_size" -le 33554432
          test "$(df -B1 --output=avail /run | tail -n 1)" -ge "$((workspace_size + site_size + 67108864))"
          for name in workspace site; do
            case "$name" in workspace) source=$workspace ;; site) source=$site ;; esac
            /usr/bin/python3 -I -S -B /run/qtt-lp03-containment/seal.py "$name"
            diff -qr --no-dereference "$source" "$sealed/$name" >/dev/null
            printf 'LP03_SEAL_BYTES_VERIFIED %s\n' "$name"
          done
          unsafe_input=$(find "$sealed" \( -type d -o -type f \) \( ! -uid 0 -o -perm /022 -o -perm /6000 \) -print -quit)
          test -z "$unsafe_input"
          SEAL_INPUTS
          qualify() {
            local fixture=$1 limit=$2
            sudo -n /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/systemd-run \
              --unit="qtt-lp03-qualification-$fixture" --service-type=exec --wait --pipe \
              --property=Delegate=yes --property="RuntimeMaxSec=$limit" \
              --property=TimeoutStopSec=5s --property=KillMode=control-group \
              --property=WorkingDirectory=/ \
              --property='UnsetEnvironment=LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT PYTHONHOME PYTHONPATH' \
              /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C \
              /usr/bin/python3 -I -B /run/qtt-lp03-containment/controller.py "$fixture"
          }
          qualify normal 8min
          qualify stop 1min
          qualify death 1min
      - name: Retain exact fixture receipt and stream bytes
        if: ${{ always() && steps.bootstrap.outcome == 'success' && steps.native_qualification.outcome != 'skipped' }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/bash -se <<'RETAIN'
          set -euo pipefail
          base=/run/qtt-lp03-containment
          for fixture in normal stop death; do
            case "$(systemctl show -p ActiveState --value "qtt-lp03-qualification-$fixture.service")" in
              inactive|failed) ;;
              *) exit 1 ;;
            esac
          done
          for witness in "$base"/witness/*.json; do
            test -e "$witness" || continue
            test -f "$witness" && test ! -L "$witness" && test "$(stat -c '%u' "$witness")" = 0
            printf 'LP03_ROOT_WITNESS %s ' "${witness##*/}"
            /usr/bin/base64 -w 0 "$witness"
            printf '\n'
          done
          cd "$base/jail/var/qtt/runs"
          exec /usr/bin/setpriv --reuid=62041 --regid=62041 --clear-groups --no-new-privs \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all /usr/bin/python3 -I -B - <<'EXPORT'
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import stat

          bound = 1_048_576
          total = 0
          roots = sorted(path for path in Path('.').iterdir() if path.name.endswith('.evidence'))
          for root in roots:
              original = root.lstat()
              if not stat.S_ISDIR(original.st_mode) or original.st_uid != 62041 or original.st_mode & 0o022:
                  raise SystemExit('Untrusted evidence root')
              nested = [path for path in root.iterdir() if re.fullmatch(r'nested-pytest-\d+-\d+', path.name)]
              for directory in (root, *sorted(nested)):
                  own = directory.lstat()
                  if not stat.S_ISDIR(own.st_mode) or own.st_uid != 62041 or own.st_mode & 0o022:
                      raise SystemExit('Untrusted nested evidence root')
                  for file in sorted(directory.iterdir()):
                      if not re.fullmatch(r'[a-z0-9-]+\.(json|stdout\.bin|stderr\.bin)', file.name):
                          continue
                      fd = os.open(file, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                      with os.fdopen(fd, 'rb') as stream:
                          item = os.fstat(stream.fileno())
                          if not stat.S_ISREG(item.st_mode) or item.st_uid != 62041 or item.st_nlink != 1:
                              raise SystemExit('Untrusted retained evidence file')
                          data = stream.read(min(bound, 2_097_152 - total) + 1)
                      total += len(data)
                      if len(data) != item.st_size or len(data) > bound or total > 2_097_152:
                          raise SystemExit('Evidence export bound or identity changed')
                      for offset in range(0, max(len(data), 1), 12_000):
                          print('LP03_NATIVE_BYTES ' + json.dumps({
                              'file': str(file), 'offset': offset, 'length': len(data),
                              'data': base64.b64encode(data[offset:offset + 12_000]).decode('ascii'),
                          }, separators=(',', ':')), flush=True)
          EXPORT
          RETAIN
