name: QTT Validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast_preflight:
    name: Fast Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: &pip_cache
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.14-pip-pytest-${{ hashFiles('.github/workflows/qtt_validation.yml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.14-pip-pytest-

      - name: Install test dependency
        run: &install_pytest |
          python -m pip install pytest

      - name: Run fast preflight
        run: python -B tools/run_validation_gates.py --phase fast-preflight --timing-report .tmp/qtt-validation-timing/fast-preflight.json

  deterministic_validators:
    name: Deterministic Validators
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run deterministic validators
        run: python -B tools/run_validation_gates.py --phase deterministic-validators --timing-report .tmp/qtt-validation-timing/deterministic-validators.json

  pytest_shard_1:
    name: Pytest Shard 1
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 1
        run: python -B tools/run_validation_gates.py --phase pytest-shard-1 --timing-report .tmp/qtt-validation-timing/pytest-shard-1.json

  pytest_shard_2:
    name: Pytest Shard 2
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 2
        run: python -B tools/run_validation_gates.py --phase pytest-shard-2 --timing-report .tmp/qtt-validation-timing/pytest-shard-2.json

  pytest_shard_3:
    name: Pytest Shard 3
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 3
        run: python -B tools/run_validation_gates.py --phase pytest-shard-3 --timing-report .tmp/qtt-validation-timing/pytest-shard-3.json

  pytest_shard_4:
    name: Pytest Shard 4
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Run pytest shard 4
        run: python -B tools/run_validation_gates.py --phase pytest-shard-4 --timing-report .tmp/qtt-validation-timing/pytest-shard-4.json

  post_validation_checks:
    name: Post Validation Checks
    runs-on: ubuntu-latest
    needs:
      - deterministic_validators
      - pytest_shard_1
      - pytest_shard_2
      - pytest_shard_3
      - pytest_shard_4
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pip download cache
        uses: actions/cache@v4
        with: *pip_cache

      - name: Install test dependency
        run: *install_pytest

      - name: Verify AtomicRows bundle materialized and SHA absent
        # Enforced by the post-validation runner phase:
        # test -f docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl
        # test ! -e docs/master_plan/atomic_rows/AtomicRows.bundle.sha256
        # expected 4183 AtomicRows rows
        run: python -B tools/run_validation_gates.py --phase post-validation --timing-report .tmp/qtt-validation-timing/post-validation.json

  validation:
    name: Validation Gates
    runs-on: ubuntu-latest
    needs:
      - fast_preflight
      - deterministic_validators
      - pytest_shard_1
      - pytest_shard_2
      - pytest_shard_3
      - pytest_shard_4
      - post_validation_checks
    if: ${{ always() }}
    timeout-minutes: 90

    steps:
      - name: Fail closed unless every phase succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = []
          for job_id, data in sorted(needs.items()):
              result = data.get("result")
              print(f"{job_id}: {result}")
              if result != "success":
                  failures.append(f"{job_id}={result}")
          if failures:
              print(
                  "Validation phase failure(s): " + ", ".join(failures),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print("All validation phase jobs succeeded.")
          PY
