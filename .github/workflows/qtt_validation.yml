              folder,=folders
              run=file_json(folder/"run.json")
              if folder.name!=run["run_id"]+".evidence" or Path(run["paths"]["repo_root"]).resolve()!=Path(os.environ["GITHUB_WORKSPACE"]).resolve():
                  raise ValueError("unbound evidence")
              target=Path(run["paths"]["process_root"])
              if target.parent!=native_parent or target!=Path(run["paths"]["cleanup_target"]):raise ValueError("unbound cleanup")
              details=report["native"]
              details["run_id"]=string(run["run_id"],r"run_[0-9]{8}T[0-9]{12}Z_[0-9]{1,12}_[0-9]{1,6}",64)
              cmd_path=folder/"command-1.json"
              if cmd_path.is_file():
                  cmd=file_json(cmd_path)
                  assert cmd["run_id"]==run["run_id"] and cmd["phase"]=="standalone-pytest-helper" and cmd["command_index"]==1
                  details["exit_code"]=None if cmd["native_exit_code"] is None else integer(cmd["native_exit_code"],-2**31,2**32-1)
                  details["timeout_seconds"]=integer(int(cmd["timeout_seconds_or_null"]),1,180)
                  details["timeout_not_triggered"]=cmd["timeout_state"]=="NOT_TRIGGERED"
                  details["terminal_and_both_pipes_eof"]=cmd["termination_state"]=="TERMINAL:PROVEN;PIPES:EOF"
                  for ch in ("stdout","stderr"):
                      p=folder/f"command-1.{ch}.bin"
                      assert Path(cmd[ch+"_path"])==p
                      size=integer(cmd[ch+"_byte_count"])
                      details[ch+"_bytes"]=size
                      # The native helper already validated its original streams; independently read them to EOF.
                      read=0
                      with p.open("rb") as raw:
                          while chunk:=raw.read(65536):read+=len(chunk)
                      details[ch+"_complete_length_verified"]=read==size
              completion_path=folder/"completion.json"
              if completion_path.is_file():
                  cc=file_json(completion_path)
                  assert cc["run_id"]==run["run_id"] and cc["phase"]=="standalone-pytest-helper"
                  details["command_counts"]={k:integer(cc["command_count_"+k],0,1) for k in ("planned","started","completed")}
              clean_path=folder/"cleanup.json"
              if clean_path.is_file():
                  c=file_json(clean_path)
                  assert c["run_id"]==run["run_id"] and Path(c["cleanup_target"])==target
                  details["exact_root_removed"]=c["cleanup_state"]=="PASS_REMOVED_EXACT_RUN_ROOT" and not os.path.lexists(target)
                  details["parent_preserved"]=flag(c["parent_preserved"])
              stream=folder/"command-1.stdout.bin"
              if stream.is_file():measure(read_markers(stream),report)
          states=stages()
          report={"sample":integer(int(os.environ["SAMPLE"]),1,3),"run_id":integer(int(os.environ["GITHUB_RUN_ID"])),
              "run_attempt":integer(int(os.environ["GITHUB_RUN_ATTEMPT"]),1,1),"outcome":"UNVERIFIED",
              "baseline":"4fbf5759b142c4d813aa4deb241c6fb1a5054a93","tree":"ca9d5f8ce6eff120a0a6b71c048ac87c7f5fd891",
              "steps":states,"environment":{},"native":{},"observed":{},"failure_stage":stop_stage(states),"failure_class":recorded_failure(states)}
          try:
              # Preserve independent sample groups even when another group is unavailable.
              failed=False
              for gather in (environment,native):
                  try:gather(report)
                  except Exception:failed=True
              summary=file_json(private/"summary.json")
              report["checkout_clean"]=(summary.get("post_checkout")==dict(head=report["baseline"],tree=report["tree"],status="")
                  and summary.get("ignored_paths_absent") is True)
              n=report["native"]; obs=report["observed"]
              if (not failed and all(v=="success" for v in states.values()) and summary.get("outcome")=="PASS"
                  and report["checkout_clean"] and n["terminal_and_both_pipes_eof"] and n["exact_root_removed"]
                  and n["parent_preserved"] and n["stdout_complete_length_verified"] and n["stderr_complete_length_verified"]
                  and n["exit_code"]==0 and n["timeout_not_triggered"] and n["timeout_seconds"]==180
                  and {"owner_anchor","declaration","target_prefix","checkpoint","currentness","native_sql_entry","limits","committed","counts","caps"}<=obs.keys()
                  and obs["committed"]["all_native_rows_equal"] and obs["committed"]["receipt_rows"]==2 and obs["committed"]["reservation_rows"]==8):
                  report.update(outcome="PASS",failure_stage=None,failure_class=None)
          except Exception:
              pass
          report["unverified_observation_groups"]=[k for k in ("owner_anchor","declaration","target_prefix","checkpoint","currentness",
              "native_sql_entry","limits","committed","counts","caps") if k not in report["observed"]]
          data=(json.dumps(report,sort_keys=True,indent=2,allow_nan=False)+"\n").encode("ascii")
          if len(data)>MAX_PUBLIC_BYTES:
              data=(json.dumps({"outcome":"UNVERIFIED","sample":report["sample"],"failure_stage":"public_evidence",
                  "failure_class":"PUBLIC_SIZE_LIMIT","unverified_observation_groups":["all"]})+"\n").encode("ascii")
              report["outcome"]="UNVERIFIED"
          tmp=output.with_suffix(".tmp")
          with tmp.open("xb") as f:f.write(data)
          assert tmp.read_bytes()==data and len(data)<=MAX_PUBLIC_BYTES
          os.replace(tmp,output)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as sink:
              sink.write(f'MATH-03 observation {report["sample"]}: {report["outcome"]}. See the bounded observation artifact.\n')
          if report["outcome"]!="PASS":raise SystemExit(1)
          PY

      - name: Check out the reviewed protected source
        id: checkout
        timeout-minutes: 5
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 4fbf5759b142c4d813aa4deb241c6fb1a5054a93
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the shard 8 interpreter
        id: setup
        timeout-minutes: 2
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
          architecture: x64

      - name: Restore the existing shard 8 pip download cache
        timeout-minutes: 1
        id: pip-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.14.6-pip-pytest-9.1.1-observation-4fbf5759
          restore-keys: |
            ${{ runner.os }}-python-3.14.6-pip-pytest-9.1.1-

      - name: Install the pinned shard 8 dependencies
        id: install
        timeout-minutes: 2
        env:
          PIP_CACHE_DIR: ~/.cache/pip
        run: |
          set -euo pipefail
          evidence="$(cygpath -u "$MATH03_ROOT")/evidence"
          python -m pip cache info > "$evidence/pip-cache-before.txt" 2>&1
          python -m pip install pytest==9.1.1 > "$evidence/pytest-install.txt" 2>&1
          python -m pip install --only-binary=:all: --no-deps --index-url https://pypi.org/simple websockets==17.0.1 cryptography==50.0.1 cffi==2.1.1 pycparser==3.0 fido2==2.2.1 > "$evidence/dependency-install.txt" 2>&1
          python -m pip cache info > "$evidence/pip-cache-after.txt" 2>&1

      - name: Run one current MATH-03 registration
        id: control
        timeout-minutes: 5
        env:
          PIP_CACHE_HIT: ${{ steps.pip-cache.outputs.cache-hit }}
          PIP_CACHE_MATCH: ${{ steps.pip-cache.outputs.cache-matched-key }}
        run: python -I -B "$(cygpath -u "$MATH03_ROOT")/run_once.py" > "$(cygpath -u "$MATH03_ROOT")/evidence/control.stdout" 2> "$(cygpath -u "$MATH03_ROOT")/evidence/control.stderr"

      - name: Verify the native run, exact cleanup and checkout
        id: verify
        if: ${{ always() }}
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: python -I -B "$(cygpath -u "$MATH03_ROOT")/verify.py" > "$(cygpath -u "$MATH03_ROOT")/evidence/verify.stdout" 2> "$(cygpath -u "$MATH03_ROOT")/evidence/verify.stderr"

      - name: Produce the bounded public observation
        if: ${{ always() }}
        env:
          CHECKOUT_STATE: ${{ steps.checkout.outcome }}
          SETUP_STATE: ${{ steps.setup.outcome }}
          CACHE_STATE: ${{ steps.pip-cache.outcome }}
          INSTALL_STATE: ${{ steps.install.outcome }}
          CONTROL_STATE: ${{ steps.control.outcome }}
          VERIFY_STATE: ${{ steps.verify.outcome }}
        run: python -I -B "$(cygpath -u "$MATH03_ROOT")/public_report.py" > "$(cygpath -u "$MATH03_ROOT")/evidence/export.stdout" 2> "$(cygpath -u "$MATH03_ROOT")/evidence/export.stderr"

      - name: Retain the approved observation fields
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: math03-checkpoint-${{ github.run_id }}-${{ matrix.observation }}
          path: ${{ runner.temp }}/m03-${{ github.run_id }}-${{ matrix.observation }}/public/observation.json
          if-no-files-found: error
          retention-days: 7
