name: QTT Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Validation Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependency
        run: |
          python -m pip install pytest

      - name: Run canonical validation gates
        run: python tools/run_validation_gates.py

      - name: Compile Python sources
        run: python -m compileall -q tools tests src

      - name: Check diff whitespace
        run: git diff --check

      - name: Verify master plan unchanged by validation
        run: git diff --exit-code -- docs/master_plan/QTT_MasterPlan_Current.md

      - name: Verify AtomicRows bundle remains absent
        run: |
          test ! -e docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl
          test ! -e docs/master_plan/atomic_rows/AtomicRows.bundle.sha256