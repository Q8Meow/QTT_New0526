      - name: Prepare the verified interpreter for setup-python
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          version=/opt/hostedtoolcache/Python/3.14.6
          test ! -e "$version" && test ! -L "$version"
          input=$(mktemp -d "$RUNNER_TEMP/qtt-lp03-python.XXXXXXXX")
