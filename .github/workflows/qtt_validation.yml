name: LP03 Linux context observation
run-name: LP03 context observation ${{ inputs.observation_nonce }}

on:
  workflow_dispatch:
    inputs:
      reviewed_revision:
        description: Exact reviewed observation revision
        required: true
        type: string
      observation_nonce:
        description: Recorded nonce for the single observation
        required: true
        type: string

permissions: {}

jobs:
  observe_lp03_linux_context:
    name: LP03 Linux Context Observation
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Q8Meow/QTT_New0526' && github.ref == 'refs/heads/codex/pr309-linux-context-observation' && github.actor == 'Q8Meow' && github.triggering_actor == 'Q8Meow' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe exact systemd version outputs
        shell: bash
        env:
          LP03_REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
          LP03_OBSERVATION_NONCE: ${{ inputs.observation_nonce }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = Q8Meow/QTT_New0526
          test "$GITHUB_REF" = refs/heads/codex/pr309-linux-context-observation
          test "$GITHUB_WORKFLOW_REF" = Q8Meow/QTT_New0526/.github/workflows/qtt_validation.yml@refs/heads/codex/pr309-linux-context-observation
          test "$GITHUB_ACTOR" = Q8Meow
          test "$GITHUB_TRIGGERING_ACTOR" = Q8Meow
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_JOB" = observe_lp03_linux_context
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$LP03_OBSERVATION_NONCE" =~ ^[0-9a-f]{32}$ ]]
          [[ "$LP03_REVIEWED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$LP03_REVIEWED_REVISION"
          test "$GITHUB_WORKFLOW_SHA" = "$LP03_REVIEWED_REVISION"

          printf 'LP03_BINDING nonce=%s repo=%s ref=%s run=%s attempt=%s job=%s\n' \
            "$LP03_OBSERVATION_NONCE" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB"
          printf 'LP03_IMAGE os=%q version=%q runner_os=%q runner_arch=%q\n' \
            "${ImageOS-}" "${ImageVersion-}" "${RUNNER_OS-}" "${RUNNER_ARCH-}"

          read_failed=0
          capture() {
            local label=$1 packet
            shift
            # Encode each stream in its own pipe before command substitution can strip LF.
            packet=$(
              exec 3>&1
              stdout_b64=$(
                {
                  exec 4>&1
                  stderr_b64=$(
                    {
                      if "$@" 2>&1 1>&4 3>&- 4>&-; then
                        rc=0
                      else
                        rc=$?
                      fi
                      printf 'exit=%d\n' "$rc" >&3
                    } | base64 -w 0
                  )
                  printf 'stderr=%s\n' "$stderr_b64" >&3
                } | base64 -w 0
              )
              printf 'stdout=%s\n' "$stdout_b64" >&3
            )
            printf 'LP03_OBSERVATION_BEGIN %s\n%s\nLP03_OBSERVATION_END %s\n' "$label" "$packet" "$label"
            if [[ "$packet" != $'exit=0\n'* ]]; then
              read_failed=1
            fi
          }

          capture os_release grep -E '^(NAME|VERSION|VERSION_ID|PRETTY_NAME)=' /etc/os-release
          capture architecture uname -m
          capture kernel uname -r
          capture systemd_binary systemd --version
          capture systemd_manager systemctl show --property=Version --value
          capture systemd_package dpkg-query -W -f='${Version}\n' systemd
          exit "$read_failed"
