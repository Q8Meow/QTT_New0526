name: MATH-03 hosted checkpoint observations
run-name: MATH-03 checkpoint observations (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math03_checkpoint:
    name: MATH-03 checkpoint observation ${{ matrix.observation }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        observation: [1, 2, 3]
    env:
      SAMPLE: ${{ matrix.observation }}
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Allocate a job-private observation directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Q8Meow/QTT_New0526' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or
              $env:GITHUB_REF -ne 'refs/heads/codex/lp03-math03-checkpoint-observation' -or $env:GITHUB_RUN_ATTEMPT -ne '1') {
            throw 'This diagnostic requires its reviewed scratch branch and a first manual run attempt.'
          }
          $observation = Join-Path $env:RUNNER_TEMP ("m03-{0}-{1}" -f $env:GITHUB_RUN_ID,$env:SAMPLE)
          if (Test-Path -LiteralPath $observation) { throw 'The job observation directory already exists.' }
          New-Item -ItemType Directory -Path $observation | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $observation 'evidence') | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $observation 'public') | Out-Null
          [ordered]@{ sample=[int]$env:SAMPLE; outcome='UNVERIFIED'; failure_stage='initialization';
            failure_class='FINAL_OBSERVATION_UNAVAILABLE'; unverified_observation_groups=@('all') } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $observation 'public/observation.json') -Encoding utf8
          "MATH03_ROOT=$observation" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{ sample=$env:SAMPLE; run=$env:GITHUB_RUN_ID; workflowRevision=$env:GITHUB_SHA;
            imageOS=$env:ImageOS; imageVersion=$env:ImageVersion; runnerOS=$env:RUNNER_OS; runnerArch=$env:RUNNER_ARCH;
            job=$env:GITHUB_JOB; repository=$env:GITHUB_REPOSITORY; startedUtc=[DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $observation 'evidence/job.json') -Encoding utf8

      - name: Write the read-only native clock observer
        run: |
          set -euo pipefail
          destination="$(cygpath -u "$MATH03_ROOT")"
          cat > "$destination/meter.py" <<'PY'
          """Read-only CPython observations for one synthetic registration."""
          import collections
          import json
          import os
          from pathlib import Path
          import sqlite3
          import sys
          import time
          import types

          from src.qtt.agents.pr169_agent_orch1_resolvers import _EvidenceIssuerStateV1
          from src.qtt.stage1_prediction_markets.qku_computation_control_plane.persistence import (
              _EvidenceBoundStoreV1, _EvidenceRegistrationOperationV1,
          )
          from src.qtt.stage1_prediction_markets.qku_computation_control_plane.sqlite_reference import SQLiteReferenceAdapterV1
          from src.qtt.stage1_prediction_markets.qku_computation_control_plane.serialization import deterministic_json

          ROOT = Path(__file__).resolve().parent
          REPO = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          P = {}


          def native_sample():
              return time.time_ns(), time.monotonic_ns(), time.process_time_ns()


          def sample_dict(sample):
              return dict(zip(("wall_ns", "monotonic_ns", "process_cpu_ns"), sample, strict=True))


          def emit(kind, data):
              print("MATH03_CONTROL_" + kind + "=" + json.dumps(data, sort_keys=True), flush=True)


          def check_imports():
              paths = {n: str(Path(m.__file__).resolve()) for n, m in tuple(sys.modules.items())
                       if n.startswith(("src.qtt", "tests.stage1_prediction_markets", "tools.validation_reliability"))
                       and getattr(m, "__file__", None)}
              assert paths and all(Path(p).is_relative_to(REPO) for p in paths.values()), paths
              return dict(pid=os.getpid(), python=sys.executable, version=sys.version,
                          cwd=os.getcwd(), loaded_project_modules=len(paths),
                          adapter_source=paths[SQLiteReferenceAdapterV1.__module__])


          def observe_registration(issuer, context, state, store, request, grant, declared_protocol, signed_fixture):
              monitor = sys.monitoring
              tool_id = 3
              assert monitor.get_tool(tool_id) is None
              register_code = SQLiteReferenceAdapterV1._evidence_register_experiment_v1.__code__
              effect_code, = [c for c in register_code.co_consts if isinstance(c, types.CodeType) and c.co_name == "effect"]
              current_code = _EvidenceIssuerStateV1._registration_current_v1.__code__
              bound_code = _EvidenceBoundStoreV1._require_original_objects_v1.__code__
              read_code = SQLiteReferenceAdapterV1._evidence_read_control_members_v1.__code__
              init_code = _EvidenceRegistrationOperationV1.__init__.__code__
              guard_code = _EvidenceRegistrationOperationV1._check_current_v1.__code__
              rows = []
              checkpoints, commit_entries, custody, enforced, admissions = [], [], [], [], []
              original_connection = store._connection
              assert type(store) is SQLiteReferenceAdapterV1 and type(original_connection) is sqlite3.Connection
              assert not original_connection.in_transaction and not state.registrations

              def is_effect(frame):
                  return (frame is not None and frame.f_code is effect_code
                          and frame.f_locals["sql"] == "COMMIT")

              def line(code, number):
                  frame = sys._getframe(1)
                  assert frame.f_code is code
                  if (code, number) == (register_code, 738):
                      raw = native_sample()
                      loc = frame.f_locals
                      active = loc["operation"]
                      retained = store._evidence_store_binding_v1
                      checkpoints.append((raw, active, active.commit_state, type(active) is _EvidenceRegistrationOperationV1,
                          loc["self"] is state.control_store is store,
                          loc["connection"] is retained._EvidenceBoundStoreV1__connection is store._connection is original_connection,
                          original_connection.in_transaction, state.registrations[grant.grant_ref] is state.operation is active))
                  elif (code, number) == (init_code, 885):
                      loc = frame.f_locals
                      admissions.append((loc["_wall"], loc["mono"], loc["cpu"]))
                  elif (code, number) == (effect_code, 659):
                      if is_effect(frame):
                          raw = native_sample()
                          loc = frame.f_locals
                          active = loc["operation"]
                          commit_entries.append((raw, active, active.commit_state,
                              loc["connection"] is original_connection is store._connection,
                              original_connection.in_transaction, state.operation is active,
                              frame.f_back.f_code is register_code and frame.f_back.f_locals["self"] is store,
                              dict(active.consumed)))
                  elif (code, number) == (read_code, 954):
                      loc = frame.f_locals
                      if loc["stage"] == "REGISTERED_EXPERIMENT":
                          dbrow, = loc["rows"]
                          rows.append((loc["table"], loc["ref"], dbrow[0], dbrow[1],
                                       loc["reader"] is not original_connection, id(loc["reader"]),
                                       id(loc["operation"]), loc["operation"].commit_state))
                  else:
                      return monitor.DISABLE

              def returned(code, _offset, value):
                  frame = sys._getframe(1)
                  assert frame.f_code is code
                  if code is bound_code:
                      current = frame.f_back
                      if current.f_code is not current_code:
                          return
                  else:
                      current = frame
                  guard = current.f_back
                  if guard.f_code is not guard_code or not is_effect(guard.f_back):
                      return
                  loc = current.f_locals
                  active = loc["operation"]
                  if code is bound_code:
                      retained = frame.f_locals["self"]
                      custody.append((id(retained), id(store), id(original_connection),
                          retained is store._evidence_store_binding_v1 and frame.f_locals["adapter"] is store,
                          frame.f_locals["host_binding"] is state.host,
                          retained._EvidenceBoundStoreV1__connection is original_connection,
                          type(active) is _EvidenceRegistrationOperationV1 and active is state.operation,
                          active.commit_state, original_connection.in_transaction))
                      return
                  assert code is current_code
                  signed = loc["_signed"]
                  key_rows = tuple((k.key_id, k.valid_from_wall_ns, k.exclusive_expiry_wall_ns,
                                    k.validity_record_ref, type(k.revocation_record_ref_or_absence).__name__)
                                   for k in loc["keys"])
                  rights = tuple((r.rights_ref, r.valid_from_wall_ns, r.exclusive_expiry_wall_ns,
                                  r.exclusive_retention_wall_ns, c.rights_by_id.get(r.rights_ref) is r,
                                  r.rights_ref not in c.withdrawn, r.generation, c.generation,
                                  c.lock._is_owned(), r.source_selection.selection.record_refs)
                                 for c, policies in active.policies for r in policies)
                  enforced.append(dict(operation=id(active), sample=value, protocol=active.protocol,
                      signed=signed, message=loc["message"], envelope=loc["envelope"], deadline=loc["deadline"],
                      keys=key_rows, rights=rights, original=active.protocol is active.resolved_policy_original[0],
                      signed_entry=any(entry is active.envelope_entry for entry in state.owner_envelopes),
                      original_blob=active.resolved_policy_original[2], aggregate=loc["envelope"].aggregate_execution_limits,
                      effective_expiry=active.records[0].expiry_wall_ns,
                      cancelled=loc["ref"] in state.cancelled_envelopes, generation=state.generation,
                      active=state.registrations[grant.grant_ref] is state.operation is active))

              monitor.use_tool_id(tool_id, "math03-positive-clock")
              try:
                  monitor.register_callback(tool_id, monitor.events.LINE, line)
                  monitor.register_callback(tool_id, monitor.events.PY_RETURN, returned)
                  for code in (init_code, register_code, effect_code, read_code):
                      monitor.set_local_events(tool_id, code, monitor.events.LINE)
                  for code in (bound_code, current_code):
                      monitor.set_local_events(tool_id, code, monitor.events.PY_RETURN)
                  try:
                      result = issuer.register_evidence_experiment_v1(request, issuer_context=context)
                  finally:
                      for code in (init_code, register_code, effect_code, read_code, bound_code, current_code):
                          monitor.set_local_events(tool_id, code, 0)
              finally:
                  monitor.register_callback(tool_id, monitor.events.LINE, None)
                  monitor.register_callback(tool_id, monitor.events.PY_RETURN, None)
                  monitor.free_tool_id(tool_id)
                  emit("PHASE_COUNTS", dict(admission=len(admissions), custody=len(custody),
                       checkpoint_738=len(checkpoints),guard_sample=len(enforced), commit_entry=len(commit_entries), returned_rows=len(rows)))
                  for ck in checkpoints:
                      emit("ATTEMPTED_ENTRY", dict(original=sample_dict(ck[0]), state=ck[2], operation=id(ck[1]),
                          native_registration_type=ck[3], original_adapter=ck[4], same_bound_connection=ck[5],
                          original_transaction_open=ck[6], original_active=ck[7]))
                  for witness in enforced:
                      protocol, deadline = witness["protocol"], witness["deadline"]
                      emit("NATIVE_GUARD", dict(original=sample_dict(witness["sample"]), operation=witness["operation"],
                          deadline=deadline.exclusive_deadline_monotonic_ns, admission=deadline.admitted_monotonic_ns,
                          clock_domain=deadline.clock_domain_id, process=deadline.process_identity_ref, boot=deadline.boot_identity_ref,
                          protocol=[protocol.valid_from_wall_ns,protocol.exclusive_expiry_wall_ns],
                          message=[witness["message"].valid_from_wall_ns,witness["message"].exclusive_expiry_wall_ns],
                          envelope=witness["envelope"].exclusive_expiry_wall_ns, original_keys=witness["keys"], original_rights=witness["rights"],
                          native_custody=custody, declared_protocol_matches=protocol == declared_protocol))
                  for observation in commit_entries:
                      emit("BEFORE_NATIVE_COMMIT", dict(original=sample_dict(observation[0]), state=observation[2],
                          same_connection=observation[3], transaction_open=observation[4], original_active=observation[5],
                          original_adapter_frame=observation[6], original_operation=id(observation[1])))
              admission, = admissions
              cur, = enforced
              original_binding, = custody
              checkpoint, = checkpoints
              checkpoint_sample = checkpoint[0]
              commit, = commit_entries
              entry, registered, commit_state, same_connection, open_transaction, active, original_frame, consumed = commit
              assert all(original_binding[3:7]) and original_binding[7:] == ("COMMIT_ATTEMPTED", True)
              assert commit_state == "COMMIT_ATTEMPTED" and all((same_connection, open_transaction, active, original_frame))
              assert checkpoint[1] is registered and checkpoint[2] == "COMMIT_ATTEMPTED" and all(checkpoint[3:])
              assert cur["operation"] == id(registered) and cur["original"] and cur["active"] and cur["signed_entry"]
              assert not cur["cancelled"] and cur["signed"].canonical_message == signed_fixture.canonical_message
              assert cur["signed"].signature_hex == signed_fixture.signature_hex
              assert cur["signed"].canonical_message == deterministic_json(cur["message"])
              assert deterministic_json(cur["message"].payload) == deterministic_json(cur["envelope"])
              assert cur["protocol"] == declared_protocol and cur["original_blob"] == deterministic_json(declared_protocol)
              assert registered is state.registrations[grant.grant_ref] and registered.handle is result
              assert registered.commit_state == "COMMITTED_AND_READBACK" and not original_connection.in_transaction
              assert registered.compilation is None and not registered.attempts
              assert [(t, ref) for t, ref, *_ in rows] == list(registered.readback_refs)
              assert collections.Counter(row[0] for row in rows) == {"receipt_records": 2, "idempotency_claims": 8}
              assert len({row[5] for row in rows}) == 1
              for row, body in zip(rows, registered.readback_bodies, strict=True):
                  assert row[2] == len(row[3]) and row[3] == body.encode() and row[4]
                  assert row[6:] == (id(registered), "COMMITTED_PENDING_READBACK")
              assert registered.commit_observation[1] >= entry[1] >= cur["sample"][1] >= checkpoint_sample[1] >= admission[1]
              assert registered.readback_observation[1] >= registered.commit_observation[1]
              assert registered.deadline.admitted_monotonic_ns == admission[1]
              assert cur["protocol"].exclusive_expiry_wall_ns == P["declaration"]["exclusive_expiry_wall_ns"]
              limits = []
              def limit(name, domain, end, start=None):
                  index = {"wall":0, "monotonic":1, "process_cpu":2}[domain]
                  t = entry[index]
                  limits.append(dict(name=name, domain=domain, exclusive_end_ns=end, valid_from_ns=start,
                      remaining_at_checkpoint_738_ns=end-checkpoint_sample[index],
                      remaining_at_sql_659_ns=end-t, remaining_at_native_guard_ns=end-cur["sample"][index],
                      elapsed_since_valid_from_at_checkpoint_ns=(None if start is None else checkpoint_sample[index]-start)))
                  assert t < end and (start is None or start <= t)
                  assert checkpoint_sample[index] < end and (start is None or start <= checkpoint_sample[index])
              proto, msg, env, dl = (cur[k] for k in ("protocol","message","envelope","deadline"))
              limit("parameter_protocol", "wall", proto.exclusive_expiry_wall_ns, proto.valid_from_wall_ns)
              limit("owner_message", "wall", msg.exclusive_expiry_wall_ns, msg.valid_from_wall_ns)
              limit("owner_envelope", "wall", env.exclusive_expiry_wall_ns)
              limit("effective_experiment_expiry", "wall", cur["effective_expiry"])
              limit("registration", "monotonic", dl.exclusive_deadline_monotonic_ns, dl.admitted_monotonic_ns)
              for key_id, valid_from, expiry, validity_ref, revoked in cur["keys"]:
                  limit("key/" + key_id, "wall", expiry, valid_from)
              for ref, start, expiry, retention, orig, current, generation, held_generation, locked, refs in cur["rights"]:
                  assert orig and current and generation == held_generation and locked
                  limit("rights_validity/" + ref, "wall", expiry, start)
                  limit("rights_retention/" + ref, "wall", retention)
              assert {r[0] for r in cur["rights"]} == set(env.source_rights_refs)
              assert proto.source_receipt_ref and any(proto.parameter_protocol_ref in r[-1] for r in cur["rights"])
              cap = cur["aggregate"]
              assert cap.max_wall_ns == 240_000_000_000 and cap.max_cpu_ns == 40_000_000_000
              assert env.per_attempt_limits.max_cpu_ns == 10_000_000_000
              assert registered.started_cpu_ns == admission[2] and state.supervisor is None
              # Aggregate resources are inclusive budgets, distinct from exclusive deadlines.
              budgets = dict(cpu_cap_ns=cap.max_cpu_ns, wall_cap_ns=cap.max_wall_ns,
                             cpu_remaining_at_checkpoint_738_ns=cap.max_cpu_ns-(checkpoint_sample[2]-admission[2]),
                             wall_remaining_at_checkpoint_738_ns=cap.max_wall_ns-(checkpoint_sample[1]-admission[1]),
                             cpu_used_at_enforced_sample_ns=cur["sample"][2]-admission[2],
                             cpu_remaining_at_commit_entry_ns=cap.max_cpu_ns-(entry[2]-admission[2]),
                             wall_remaining_at_commit_entry_ns=cap.max_wall_ns-(entry[1]-admission[1]),
                             original_accounted_consumed_before_sql=consumed)
              assert budgets["cpu_remaining_at_commit_entry_ns"] >= 0
              clocks = dict(process=state.clock.process_identity_ref, boot=state.clock.boot_identity_ref,
                            monotonic_domain=state.clock.clock_domain_id,
                            declarations=json.loads(deterministic_json(state.clock.declaration_v1())))
              emit("RESULT", dict(math="MATH-03", origin=env.permitted_origins[0].value, declarations=P,
                  cap_profile=dict(aggregate_wall_ns=cap.max_wall_ns, aggregate_cpu_ns=cap.max_cpu_ns,
                                   per_attempt_cpu_ns=env.per_attempt_limits.max_cpu_ns),
                  clocks=clocks, admission=sample_dict(admission), enforced_sample=sample_dict(cur["sample"]),
                  attempted_checkpoint_738=sample_dict(checkpoint_sample),
                  commit_sql_entry_659=sample_dict(entry), deadlines=limits, budgets=budgets,
                  declaration_to_checkpoint_738_monotonic_ns=checkpoint_sample[1]-P["declaration"]["after"]["monotonic_ns"],
                  declaration_to_checkpoint_738_wall_ns=checkpoint_sample[0]-P["declaration"]["after"]["wall_ns"],
                  declaration_to_checkpoint_738_monotonic_bracket_ns=[checkpoint_sample[1]-P["declaration"][p]["monotonic_ns"] for p in ("after","before")],
                  declaration_to_commit_entry_monotonic_ns=entry[1]-P["declaration"]["after"]["monotonic_ns"],
                  declaration_to_commit_entry_wall_ns=entry[0]-P["declaration"]["after"]["wall_ns"],
                  declaration_interval_before_after_ns=[entry[1]-P["declaration"][p]["monotonic_ns"] for p in ("after","before")],
                  retained_store_id=original_binding[0], adapter_id=id(store), original_connection_id=id(original_connection),
                  active_operation_id=id(registered), commit_entry_state=commit_state, original_transaction_open=open_transaction,
                  original_file=store.database_path, actual_registered_state=registered.commit_state,
                  signed_message_exact=True, original_signature_exact=True, signed_message_bytes=len(cur["signed"].canonical_message.encode()),
                  verified_generation=cur["generation"], message_key=msg.key_id, original_keys=cur["keys"],
                  original_rights=cur["rights"], protocol_ref=proto.parameter_protocol_ref,
                  protocol_source_receipt=proto.source_receipt_ref, canonical_protocol_bytes_match=True,
                  canonical_protocol_bytes=len(cur["original_blob"].encode()), owner_envelope=env.envelope_ref,
                  registration_handle=result.record_id, handle_store=result.store_id,
                  registration_commit=sample_dict(registered.commit_observation), native_readback=sample_dict(registered.readback_observation[:3]),
                  parent_assembly_readback=sample_dict(registered.parent_readback_observation[:3]),
                  rows=[dict(table=t, ref=ref, byte_count=size, direct_native_bytes_equal=True, native_reader_id=reader)
                        for t,ref,size,body,_,reader,*rest in rows], no_compilation=True, attempt_count=0,
                  verified_identity=check_imports()))
              return result
          PY

      - name: Write the source-anchored fixture builder
        run: |
          set -euo pipefail
          destination="$(cygpath -u "$MATH03_ROOT")"
          cat > "$destination/prepare.py" <<'PY'
          """Assemble the disposable test driver without importing or executing QTT."""
          import ast
          import builtins
          import os
          from pathlib import Path
          import subprocess
          import symtable
          import sys
          import textwrap

          root = Path(__file__).resolve().parent
          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          rel = Path("tests/stage1_prediction_markets/qku_computation_control_plane/tranche_f/test_replay_paper_evidence_matrix.py")
          source = (repo / rel).read_bytes()
          subprocess.run(["git","--no-optional-locks","diff","--quiet","HEAD","--",rel.as_posix()],cwd=repo,check=True)
          git_fixture = subprocess.check_output(["git","cat-file","--filters","HEAD:"+rel.as_posix()], cwd=repo)
          assert source == git_fixture
          lines = source.decode().splitlines(keepends=True)
          def native(first, last):
              return "".join(lines[first-1:last])

          def here(s):
              return textwrap.dedent(s).lstrip("\n")

          def indent(s, n):
              return textwrap.indent(here(s), " " * n)

          auth = native(1131,1151)
          auth += indent("anchor_before = time.monotonic_ns()",4) + "\n"
          auth += native(1152,1152)
          auth += indent("anchor_after = time.monotonic_ns()",4) + "\n"
          auth += native(1153,1267)
          auth += native(1279,1285)
          auth += indent("""
              meter.P["anchor"] = dict(wall_ns=now, monotonic_before_ns=anchor_before,
                  monotonic_after_ns=anchor_after, validity_seconds=validity_seconds,
                  expiry_wall_ns=expiry)
              _assert_lp03_role_store_binding_contract(tmp_path, config, fixture_keys, envelope, message)
          """,4)

          roles = native(14904,14943)
          roles += indent("assert os.name == 'nt'",4) + "\n"
          roles += native(14954,14962)
          roles += textwrap.indent(textwrap.dedent(native(14978,14980)), " " * 12)
          roles += native(14981,14983)
          roles += native(15006,15011)
          roles += indent("""
              from src.qtt.stage1_prediction_markets.qku_computation_control_plane.parameter_policy import initialize_st12f_parameter_registry_v1
              actual_message = replace(owner_message, payload=json.loads(deterministic_json(actual_envelope)))
              seal_snapshot(tmp_path, fixture_keys, actual_envelope, actual_message,
                  hosts, bindings, initialize_st12f_parameter_registry_v1(), adapters, register=True, registration_cut="protocol_expiry")
          """,8)
          roles += native(15965,15967)

          seal = native(4711,4741)
          seal += indent("""
              assert not original_positive and registration_cut == "protocol_expiry"
              assert register and selected_math == "MATH-03" and cold_native_writer is False
              assert requested_case == ("MATH-03", None, False, False) and not cpu_boundary_witness
          """,4)
          seal += native(4742,5665)
          seal += indent("before_declaration = meter.native_sample()",8) + "\n"
          # Select the existing positive owner-envelope horizon before the protocol exists.
          # Preserve the target route's resource/custody inputs, with no short-lived protocol or wait.
          anchor = native(5666,5667)
          assert anchor.strip().endswith('else envelope.exclusive_expiry_wall_ns')
          seal += indent("protocol_expiry = envelope.exclusive_expiry_wall_ns",8) + "\n"
          seal += indent("""
              after_declaration = meter.native_sample()
              meter.P["declaration"] = dict(before=meter.sample_dict(before_declaration),
                  after=meter.sample_dict(after_declaration), original_anchor_wall_ns=meter.P["anchor"]["wall_ns"],
                  exclusive_expiry_wall_ns=protocol_expiry, envelope_expiry_wall_ns=envelope.exclusive_expiry_wall_ns,
                  branch="envelope.exclusive_expiry_wall_ns", fixture_source_lines=[5666, 5667])
          """,8)
          # Keep the target prefix verbatim, including both original refusal-before-SQL checks.
          # The no-cut-only graph driver at 6578 is false for this historical route.
          seal += native(5668,6735)
          seal += indent("""
              assert outcome._record is original_record
              assert original_part.reconstructed_canonical_events is original_events and queries == []
              meter.P["target_custody"] = dict(first_denied_before_sql=True, second_denied_before_sql=True,
                  original_record_restored=True, original_events_restored=True)
          """,4)
          seal += native(6736,6798)
          seal += native(6809,6810)
          seal += native(6904,6905)
          seal += indent("""
              experiment_ref = meter.observe_registration(issuer, issuer_context, state, store,
                  registration_request, grant, parameter_protocol, signed)
              assert experiment_ref is state.registrations[grant.grant_ref].handle
          """,8)

          entry = here("""
              def test_math03_positive(tmp_path):
                  assert not meter.P
                  assert tmp_path.resolve().is_relative_to(meter.ROOT / "native")
                  meter.emit("IDENTITY", meter.check_imports())
