  validation:
    name: Validation Gates
    runs-on: ubuntu-latest
    needs:
      - validation_shards
    if: ${{ always() }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with: *checkout_full

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Download validation shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: .tmp/qtt-validation-artifacts

      - name: Aggregate validation shard artifacts
        run: >
          python -B tools/validate_pr169_val1.py
          --repo-root .
          --artifact-root .tmp/qtt-validation-artifacts

      - name: Verify AtomicRows bundle materialized and SHA absent
        run: |
          test -f docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl
          test ! -e docs/master_plan/atomic_rows/AtomicRows.bundle.sha256
          python - <<'PY'
          from pathlib import Path

          rows = Path("docs/master_plan/atomic_rows/AtomicRows.bundle.jsonl").read_text(
              encoding="utf-8"
          ).splitlines()
          if len(rows) != 4183:
              raise SystemExit(f"expected 4183 AtomicRows rows, got {len(rows)}")
          PY

      - name: Report changed-area validation scope
        run: python -B tools/changed_area_validation_router.py --repo-root . --report-out .tmp/qtt-validation-router/validation-gates.json

      - name: Fail closed unless every phase succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          router_report = ".tmp/qtt-validation-router/validation-gates.json"
          with open(router_report, encoding="utf-8") as handle:
              router = json.load(handle)
          print("required_jobs=" + ",".join(router["required_jobs"]))
          print("full_validation_required=" + str(router["full_validation_required"]))
          print("full_validation_reason=" + router["full_validation_reason"])
          print("skipped_validator_count=" + str(len(router["skipped_validators"])))

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = []
          for job_id, data in sorted(needs.items()):
              result = data.get("result")
              print(f"{job_id}: {result}")
              if result != "success":
                  failures.append(f"{job_id}={result}")
          if failures:
              print(
                  "Validation phase failure(s): " + ", ".join(failures),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print("All validation phase jobs succeeded.")
          PY

