          """Build the single bounded public observation from job-private native evidence."""
          import json
          import os
          from pathlib import Path
          import re
          import sys

          root=Path(os.environ["MATH03_ROOT"]).resolve()
          private=root/"evidence"
          output=root/"public"/"observation.json"
          MAX_PUBLIC_BYTES=32_768
          def integer(value, low=0, high=2**63-1):
              if type(value) is not int or not low<=value<=high: raise ValueError("integer")
              return value
          def exact(value, choices):
              if value not in choices: raise ValueError("enum")
              return value
          def flag(value):
              if type(value) is not bool: raise ValueError("boolean")
              return value
          def string(value, pattern, maximum):
              if type(value) is not str or len(value)>maximum or not re.fullmatch(pattern,value): raise ValueError("identity")
              return value
          def file_json(path, cap=262_144):
              if path.stat().st_size>cap: raise ValueError("oversize")
              return json.loads(path.read_bytes())
          def sample(value):
              return {k:integer(value[k]) for k in ("wall_ns","monotonic_ns","process_cpu_ns")}
          def stages():
              return {n.lower():exact(os.environ.get(n,""),("success","failure","cancelled","skipped",""))
                      for n in ("CHECKOUT_STATE","SETUP_STATE","CACHE_STATE","INSTALL_STATE","CONTROL_STATE","VERIFY_STATE")}
          def stop_stage(states):
              if "cancelled" in states.values():
                  return next(k for k,v in states.items() if v=="cancelled")
              if states["control_state"]=="failure":return "control_state"
              return next((k for k,v in states.items() if v!="success"),"public_evidence")
          def recorded_failure(states):
              # GitHub step outcomes survive an absent or unreadable private summary.
              # An actual process exit is separately reported only from its native receipt.
              if "cancelled" in states.values():return "INTERRUPTED"
              if states["control_state"]=="failure":return "NATIVE_CONTROL_FAILED"
              return "MISSING_OR_UNVERIFIED"
          def read_markers(path):
              names={"ANCHOR","DECLARATION","TARGET_CUSTODY","ATTEMPTED_ENTRY","NATIVE_GUARD","BEFORE_NATIVE_COMMIT","RESULT","PHASE_COUNTS"}
              known={("MATH03_CONTROL_"+name+"=").encode():name for name in names}
              found={}
              with path.open("rb") as raw:
                  while line:=raw.readline(65_537):
                      if len(line)>65_536:
                          while line and not line.endswith(b"\n"): line=raw.readline(65_537)
                          continue
                      for prefix,name in known.items():
                          if line.startswith(prefix):
                              if name in found: raise ValueError("duplicate")
                              found[name]=json.loads(line[len(prefix):])
              return found
          def clock_identity(value, pattern):
              return string(value,pattern,100)
          def measure(m, report):
              observed=report["observed"]
              if "ANCHOR" in m:
                  src=m["ANCHOR"]
                  observed["owner_anchor"]={k:integer(src[k]) for k in ("wall_ns","monotonic_before_ns","monotonic_after_ns","validity_seconds","expiry_wall_ns")}
              if "DECLARATION" in m:
                  src=m["DECLARATION"]
                  observed["declaration"]={"before":sample(src["before"]),"after":sample(src["after"]),
                      "source_lines":[5666,5667],"expiry_wall_ns":integer(src["exclusive_expiry_wall_ns"]),
                      "envelope_expiry_wall_ns":integer(src["envelope_expiry_wall_ns"]),
                      "owner_anchor_wall_ns":integer(src["original_anchor_wall_ns"])}
              if "TARGET_CUSTODY" in m:
                  observed["target_prefix"]={k:flag(m["TARGET_CUSTODY"][k]) for k in
                      ("first_denied_before_sql","second_denied_before_sql","original_record_restored","original_events_restored")}
              if "ATTEMPTED_ENTRY" in m:
                  src=m["ATTEMPTED_ENTRY"]
                  observed["checkpoint"]={"source_line":738,"sample":sample(src["original"]),
                      "phase":exact(src["state"],("COMMIT_ATTEMPTED",)),**{k:flag(src[k]) for k in
                      ("native_registration_type","original_adapter","same_bound_connection","original_transaction_open","original_active")}}
              if "NATIVE_GUARD" in m:
                  src=m["NATIVE_GUARD"]
                  guarded=sample(src["original"])
                  observed["currentness"]={"sample":guarded,
                      "domain":clock_identity(src["clock_domain"],r"LP03-QPC::[0-9]{1,14}:[a-f0-9]{32}"),
                      "process":clock_identity(src["process"],r"LP03-PROCESS::[0-9]{1,12}:[0-9]{1,22}:[a-f0-9]{32}"),
                      "boot":clock_identity(src["boot"],r"LP03-BOOT::[a-f0-9]{32}"),
                      "declared_protocol_matches":flag(src["declared_protocol_matches"])}
                  limits={}
                  def add(name,domain,start,end):
                      start=None if start is None else integer(start)
                      end=integer(end)
                      idx=domain+"_ns"
